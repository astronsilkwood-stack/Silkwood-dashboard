name: Keep dashboard awake
# Every 10 minutes so the free host is awake. /healthz also runs the 8:30pm Brisbane auto final.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 https://silkwood-dashboard.onrender.com/healthz || true
