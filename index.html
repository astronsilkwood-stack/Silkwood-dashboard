<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Silkwood"><meta name="application-name" content="Silkwood">
<title>Silkwood · Daily Ops</title>
<link rel="manifest" href="/static/manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png"><link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f172a;--sl:#64748b;--sl2:#475569;--bd:#e5e7eb;--bg:#f8fafc;--ok:#0f9d6e;--okl:#e7f6ef;--bad:#dc2626;--badl:#fef2f2;--amb:#d97706;--ambl:#fff7ed;--or:#f97316;--blue:#2563eb;--bluel:#eff6ff;--pur:#7c3aed;--purl:#f5f3ff;--yel:#ca8a04;--yell:#fefce8;--mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}html,body{overflow-x:hidden}
body{margin:0;font:16px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.mono,.num,.stat b,.clock,.lbl,th{font-family:var(--mono)}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--sl);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}.app>div{min-width:0}.top input,.top select{width:auto}
aside{background:#fff;border-right:1px solid var(--bd);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 12px}
.logo{font-weight:800;font-size:20px;letter-spacing:.06em;padding:4px 10px 18px;display:flex;align-items:center;gap:8px}.logo i{width:10px;height:10px;border-radius:3px;background:var(--or);display:inline-block}
.logo span{color:var(--or)}.logo small{display:block;font:500 10px var(--mono);letter-spacing:.1em;color:var(--sl);text-transform:uppercase}
nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--sl2);text-decoration:none;font-weight:500;font-size:15px;min-height:44px}
nav a:hover{background:#f1f5f9}nav a.on{background:var(--ink);color:#fff}nav a .ic{width:20px;text-align:center}
nav a .badge{margin-left:auto;font:600 11px var(--mono);background:var(--ambl);color:var(--amb);border-radius:99px;padding:1px 7px}nav a.on .badge{background:rgba(255,255,255,.15);color:#fff}
.side-foot{margin-top:auto;font-size:12px;color:var(--sl);padding:8px 10px}
.top{position:sticky;top:0;z-index:20;background:rgba(248,250,252,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;padding:10px 24px;flex-wrap:wrap}
.top .mlogo{display:none}.clock{font-size:14px;color:var(--sl2);flex:1;white-space:nowrap}
.who{display:flex;align-items:center;gap:8px}.who select,.top input[type=date]{min-height:44px;border:1px solid var(--bd);border-radius:10px;background:#fff;padding:0 10px;font-size:15px}
.who select{font-weight:600;max-width:200px}
.shiftbtn{min-height:44px;border-radius:10px;border:1px solid var(--bd);background:#fff;padding:0 12px;font-weight:600;font-size:14px;cursor:pointer}.shiftbtn.on{border-color:var(--ok);color:var(--ok);background:var(--okl)}
main{padding:24px;max-width:1180px;width:100%}
.ph{margin:0 0 18px}.ph h1{margin:2px 0 4px;font-size:26px;font-weight:700;letter-spacing:-.02em}.ph p{margin:0;color:var(--sl)}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:18px;min-width:0}
.card h2{margin:0 0 4px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}.card h2 .sp{flex:1}
.card .help{color:var(--sl);font-size:14px;margin:0 0 12px}
.stat{display:block;text-decoration:none;color:inherit}.stat b{display:block;font-size:30px;font-weight:600;margin:6px 0 2px;letter-spacing:-.02em}.stat .sub{font-size:13px;color:var(--sl)}.stat .sub.bad{color:var(--bad);font-weight:600}
.stat:hover{border-color:#cbd5e1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 18px;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:#fff;font-weight:600;font-size:16px;cursor:pointer;text-decoration:none}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--bd)}.btn.full{width:100%}.btn.ok{background:var(--ok);border-color:var(--ok)}.btn.danger{background:#fff;color:var(--bad);border-color:#fecaca}
.btn:disabled{opacity:.4;cursor:not-allowed}.btn.sm{min-height:44px;padding:0 12px;font-size:14px}
.link{color:var(--ink);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px;background:none;border:0;cursor:pointer;min-height:44px;padding:0 4px}
input,select,textarea{border:1px solid var(--bd);border-radius:10px;background:#fff;min-height:48px;padding:0 12px;font-size:17px;width:100%}textarea{padding:10px 12px;min-height:64px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:-1px}
label.f{display:grid;gap:6px;font-size:14px;font-weight:600;color:var(--sl2)}label.f .lbl{font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1;min-width:120px}.row>.nogrow{flex:0 0 auto;min-width:0}
.seg{display:flex;background:#f1f5f9;border-radius:12px;padding:4px;gap:4px}.seg button{flex:1;min-height:44px;border:0;border-radius:9px;background:none;font-weight:600;font-size:15px;color:var(--sl2);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(15,23,42,.12)}.seg.water button.on[data-v=no]{background:var(--ok);color:#fff}.seg.water button.on[data-v=yes]{background:var(--bad);color:#fff}
.pill{display:inline-flex;align-items:center;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:3px 9px;white-space:nowrap}
.pill.pend{background:var(--ambl);color:var(--amb)}.pill.ok{background:var(--okl);color:var(--ok)}.pill.bad{background:var(--badl);color:var(--bad)}.pill.grey{background:#f1f5f9;color:var(--sl2)}
.tank{font:700 12px var(--mono);letter-spacing:.06em;border-radius:8px;padding:4px 10px;display:inline-block}
.t-ulp{background:var(--bluel);color:var(--blue)}.t-dsl{background:var(--yell);color:var(--yel)}.t-p95{background:var(--purl);color:var(--pur)}
.card.t-ulp,.card.t-dsl,.card.t-p95{background:#fff;color:inherit;border-top:4px solid}.card.t-ulp{border-top-color:var(--blue)}.card.t-dsl{border-top-color:#eab308}.card.t-p95{border-top-color:var(--pur)}
table{width:100%;border-collapse:collapse;font-size:14px}th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--sl);font-weight:600;text-align:left;padding:8px;border-bottom:1px solid var(--bd)}
td{padding:10px 8px;border-bottom:1px solid #f1f5f9;vertical-align:middle}td.mono{font-family:var(--mono)}tr.bad td{color:var(--bad);font-weight:600}
.tw{overflow-x:auto}
.list{display:grid;gap:0}.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #f1f5f9;min-height:56px}.li:first-child{border-top:0}.li .t{flex:1;min-width:0}.li .t b{font-weight:600}.li .t small{display:block;color:var(--sl);font-size:13px}
.empty{color:var(--sl);text-align:center;padding:22px 10px;font-size:15px}
.chk{width:44px;height:44px;flex:none;border-radius:12px;border:2px solid #cbd5e1;background:#fff;display:grid;place-items:center;font-size:22px;color:#fff;cursor:pointer}
.task.done .chk{background:var(--ok);border-color:var(--ok)}.task.done .t b{color:var(--sl);text-decoration:line-through}.task.late{background:var(--ambl);border-radius:10px;padding-left:8px;padding-right:8px}
.task{cursor:pointer}.qty{font:700 14px var(--mono);background:#f1f5f9;border-radius:8px;padding:6px 10px;white-space:nowrap}.task.done .qty{opacity:.5}
.edit{border:0;background:none;color:var(--sl);font-size:18px;min-width:44px;min-height:44px;cursor:pointer;border-radius:10px}.edit:hover{background:#f1f5f9}
.bar{height:8px;background:#f1f5f9;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.alert{background:var(--badl);border:1px solid #fecaca;color:#991b1b;border-radius:12px;padding:12px 14px;font-weight:600;margin-bottom:16px}
.lockbar{background:var(--ambl);border:1px solid #fed7aa;color:#9a3412;border-radius:12px;padding:10px 14px;font-weight:600;margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{min-height:44px;padding:0 14px;border-radius:99px;border:1px solid var(--bd);background:#fff;font-weight:600;font-size:15px;cursor:pointer}.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tempin{display:flex;gap:8px;align-items:stretch}.tempin input{font:600 22px var(--mono);text-align:center}.sign{flex:none;width:52px;min-height:48px;border-radius:10px;border:1px solid var(--bd);background:#fff;font:700 22px var(--mono);cursor:pointer}.sign.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tempin input.ok{border-color:var(--ok);background:var(--okl);color:var(--ok)}.tempin input.bad{border-color:var(--bad);background:var(--badl);color:var(--bad)}
.fb{font-size:14px;font-weight:600;min-height:20px;margin-top:6px}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.unit{border:1px solid var(--bd);border-radius:12px;padding:14px;display:grid;gap:8px}.unit.ok{border-color:#a7f3d0}.unit.bad{border-color:#fecaca;background:#fffafa}
.unit .nm{font-weight:600;display:flex;gap:8px;align-items:center}.unit .nm .sp{flex:1}
.hb.over{background:var(--badl);border-radius:10px;padding-left:8px;padding-right:8px}.timer{font:600 15px var(--mono)}.hb.over .timer{color:var(--bad)}
.group-h{display:flex;align-items:center;gap:10px;margin:18px 0 6px}.group-h:first-child{margin-top:0}.group-h .sp{flex:1}
dialog{border:0;border-radius:16px;padding:0;width:min(560px,94vw);max-height:90vh;color:var(--ink)}dialog::backdrop{background:rgba(15,23,42,.45)}
.dh{padding:16px 18px;border-bottom:1px solid var(--bd);font-weight:700;font-size:17px;display:flex;align-items:center}.dh span{flex:1}.dh button{border:0;background:none;font-size:22px;min-width:44px;min-height:44px;cursor:pointer}
.db{padding:16px 18px;display:grid;gap:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:99;display:flex;gap:12px;align-items:center;font-weight:600;pointer-events:none;max-width:92vw}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}.toast.good{background:var(--ok)}.toast.warn{background:var(--bad)}.toast button{background:#fff;color:var(--ink);border:0;border-radius:8px;min-height:40px;padding:0 12px;font-weight:700}
#walk{width:100vw;max-width:480px;height:100dvh;max-height:100dvh;border-radius:0}.wk{display:flex;flex-direction:column;height:100%;padding:14px 16px calc(14px + env(safe-area-inset-bottom));gap:12px}
.wname{font-size:24px;font-weight:700}.wdisp{flex:1;font:600 44px var(--mono);text-align:center;border:2px solid var(--bd);border-radius:14px;min-height:72px;display:grid;place-items:center}.wdisp.ok{border-color:var(--ok);color:var(--ok);background:var(--okl)}.wdisp.bad{border-color:var(--bad);color:var(--bad);background:var(--badl)}.wdisp.empty{color:#cbd5e1}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1;min-height:0}.pad button{font:600 26px var(--mono);border:0;border-radius:12px;background:#f1f5f9;min-height:52px;cursor:pointer}
@media(max-width:900px){
 .app{grid-template-columns:1fr}aside{position:sticky;top:0;z-index:30;height:auto;flex-direction:row;padding:0;border-right:0;border-bottom:1px solid var(--bd);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
 aside .logo,.side-foot{display:none}nav{display:flex;gap:4px;padding:8px;white-space:nowrap}nav a{padding:8px 12px;font-size:14px}nav a .badge{margin-left:4px}
 .top{position:static;padding:10px 14px}.top .mlogo{display:block;font-weight:800;letter-spacing:.06em;width:100%}.top .mlogo span{color:var(--or)}.clock{font-size:12px}
 main{padding:16px 14px 40px}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g2{grid-template-columns:1fr}.ph h1{font-size:22px}.stat b{font-size:26px}.card{padding:14px}
 .who{width:100%}.who select{flex:1;max-width:none}
}
</style>
</head><body><div class="app">
<aside><div class="logo"><i></i><div>SILK<span>WOOD</span><small>Daily ops · servo + kitchen</small></div></div><nav id="nav"></nav><div class="side-foot">Food safety &amp; daily ops</div></aside>
<div><div class="top"><div class="mlogo">SILK<span>WOOD</span></div><div class="clock" id="clock"></div><input type="date" id="date" aria-label="Day to view">
<div class="who"><select id="whoSel" aria-label="Who's on shift?"></select><button class="shiftbtn" id="shiftBtn" hidden></button></div></div>
<main id="main"><div class="empty">Loading…</div></main></div></div>
<dialog id="walk"><div class="wk"><div style="display:flex;align-items:center;font-weight:700"><span id="wProg" style="flex:1" class="mono"></span><button class="edit" onclick="walkClose()" aria-label="Close">✕</button></div><div class="bar"><i id="wBar"></i></div><div id="wBody" style="display:flex;flex-direction:column;gap:12px;flex:1;min-height:0"></div></div></dialog>
<dialog id="dlg"><div class="dh"><span id="dt"></span><button onclick="dlg.close()" aria-label="Close">✕</button></div><div class="db" id="dbody"></div></dialog>
<dialog id="nameDlg" style="max-width:380px"><form method="dialog" id="nameForm" class="db" style="padding:20px"><div class="lbl">Who's on shift?</div><h2 style="margin:0">Your name</h2><p class="help" style="margin:0;color:var(--sl)">Everything you tick or log is saved under this name. This phone remembers it.</p>
<input id="nameIn" placeholder="e.g. Sam" autocomplete="name" maxlength="40" required><button class="btn full" type="submit">Save name</button></form></dialog>
<div class="toast" id="toast"></div>
<div id="installBar" hidden style="position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:90;max-width:460px;margin:0 auto;background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:0 8px 24px rgba(15,23,42,.15);padding:12px 14px;display:flex;gap:10px;align-items:center">
<img src="/static/icon-192.png" alt="" width="40" height="40" style="border-radius:10px"><div style="flex:1;font-size:14px" id="installTxt"></div><button class="btn sm" id="installGo" hidden>Install</button><button class="edit" id="installX" aria-label="Dismiss">✕</button></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S=null,page='dashboard',mgr=sessionStorage.sw_mgr=='1',area=localStorage.sw_area||'all';
const PAGES=[['dashboard','▦','Dashboard'],['tasks','☑','Daily Tasks'],['equip','❄','Equipment Temps'],['food','🌡','Food Temps'],['hotbox','♨','Hot Box'],['discards','🗑','Discards'],['fuel','⛽','Fuel Water Paste'],['closing','🔐','Closing Checklist'],['reports','▤','Reports'],['settings','⚙','Settings']];
const TZ='Australia/Brisbane',DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const TYPES={fridge:'Fridge — should be 0–5°C',freezer:'Freezer — should be −15°C or colder',hot:'Hot hold — should be 60°C or hotter',core:'Cooked food — core 75°C or hotter'};
const ICON={freezer:'🧊',fridge:'🥤',hot:'🔥',core:'🍗'};
const me=()=>localStorage.sw_staff||'';
/* ---------- helpers ---------- */
let toastT;function toast(m,kind,act,fn){const t=$('#toast');t.className='toast on '+(kind||'');t.textContent=m;if(act){const b=document.createElement('button');b.textContent=act;b.onclick=()=>{t.classList.remove('on');fn()};t.appendChild(b)}clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),act?6000:2600)}
const nowHM=()=>new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:TZ});
const hm12=t=>{if(!t)return'';const x=t.length>5?t.slice(11,16):t;let[h,m]=x.split(':').map(Number);return(h%12||12)+':'+String(m).padStart(2,'0')+(h<12?' am':' pm')};
const ts=t=>new Date(t.replace(' ','T')+'+10:00').getTime();
function tick1(){$('#clock').textContent=new Date().toLocaleString('en-US',{timeZone:TZ,weekday:'short',month:'short',day:'numeric'})+' · '+new Date().toLocaleTimeString('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit',second:'2-digit'});
 $$('.timer[data-in]').forEach(e=>{const ms=Date.now()-ts(e.dataset.in),m=Math.max(0,Math.floor(ms/6e4));e.textContent=Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m';e.closest('.hb')?.classList.toggle('over',ms>S.hotbox_max_h*36e5)})}
setInterval(tick1,1000);
async function api(p,b){if(b&&!me()){await pickName();if(!me())throw 0}
 const hd={'X-Staff-Pin':localStorage.sw_pin||''},o=b?{method:'POST',headers:{...hd,'Content-Type':'application/json'},body:JSON.stringify({date:S?.date,staff:me(),...b})}:{headers:hd};
 const r=await fetch(p,o),j=await r.json();
 if(r.status==400&&j.name){await pickName();return api(p,b)}
 if(r.status==401&&j.pin){const pin=prompt((localStorage.sw_pin?'Wrong PIN. ':'')+'Enter the Silkwood staff PIN');if(pin!==null){localStorage.sw_pin=pin.trim();return api(p,b)}throw j}
 if(!r.ok){toast(j.error||'Something went wrong','warn');throw j}return j}
async function load(d){S=await api('/api/day?date='+(d||$('#date').value||''));$('#date').value=S.date;render()}
async function post(p,b,msg){S=await api(p,b);render();if(msg)toast(msg,'good');return S}
const items=k=>S.items.filter(i=>i.kind==k),logs=(k,r)=>S.logs.filter(l=>l.kind==k&&(r==null||l.ref==String(r)));
const isToday=()=>S.date==S.today;
/* ---------- who's on shift ---------- */
function names(){const n=new Set(JSON.parse(localStorage.sw_names||'[]'));(S?.shifts||[]).forEach(x=>n.add(x.staff));if(me())n.add(me());return [...n].filter(Boolean).sort()}
function whoUI(){const sel=$('#whoSel');sel.innerHTML=`<option value="">Who's on shift?</option>`+names().map(n=>`<option ${n==me()?'selected':''}>${esc(n)}</option>`).join('')+`<option value="__new">＋ Add my name…</option>`;
 const m=myShift();$('#shiftBtn').hidden=!me()||!S||!isToday();$('#shiftBtn').className='shiftbtn'+(m?' on':'');$('#shiftBtn').textContent=m?'● On shift since '+hm12(m.start_at)+' · End':'▶ Start shift'}
function setName(n){n=(n||'').trim().slice(0,40);if(!n)return;localStorage.sw_staff=n;const l=new Set(JSON.parse(localStorage.sw_names||'[]'));l.add(n);localStorage.sw_names=JSON.stringify([...l]);whoUI();toast('Hi '+n+' 👋','good')}
let nameWait=null;function pickName(){$('#nameIn').value='';$('#nameDlg').showModal();setTimeout(()=>$('#nameIn').focus(),50);return new Promise(r=>nameWait=r)}
$('#nameForm').onsubmit=e=>{const n=$('#nameIn').value.trim();if(!n){e.preventDefault();return}setName(n);nameWait&&nameWait(n);nameWait=null};
$('#nameDlg').addEventListener('close',()=>{nameWait&&nameWait('');nameWait=null});
$('#whoSel').onchange=e=>{const v=e.target.value;if(v=='__new'){pickName().then(whoUI)}else if(v){setName(v)}else whoUI()};
const myShift=()=>S&&isToday()&&(S.shifts||[]).find(x=>x.staff==me()&&!x.end_at);
$('#shiftBtn').onclick=async()=>{const m=myShift();if(!m){await post('/api/shift',{action:'start',area:area=='all'?'':area});return toast('▶ Shift started '+hm12(myShift()?.start_at),'good')}
 const h=((Date.now()-ts(m.start_at))/36e5).toFixed(1);openDlg('End your shift?',`<p>Started <b>${hm12(m.start_at)}</b> · about <b class="mono">${h} h</b></p><div class="row"><button class="btn ghost" onclick="dlg.close()">Not yet</button><button class="btn" id="cEnd">Yes, end shift</button></div>`);
 $('#cEnd').onclick=async()=>{await post('/api/shift',{action:'end'});dlg.close();const x=S.shifts.filter(x=>x.staff==me()).pop();toast('Shift ended · '+(x?.hours??'')+' h','good')}};
$('#date').onchange=()=>load($('#date').value);
/* ---------- nav ---------- */

 const f=t.title.match(/^Fill up:\s*(.*)$/i);if(f)return{group:'Fill up',name:f[1],qty:''};return{group:t.tab=='kitchen'?'Kitchen jobs':'Shop / site jobs',name:t.title,qty:''}}
const isLate=x=>!x.done&&x.due_time&&isToday()&&x.due_time<nowHM();
function taskRow(x){const p=parseTask(x);return `<div class="li task ${x.done?'done':''} ${isLate(x)?'late':''}" onclick="if(!event.target.closest('.edit'))tick(${x.id},${!!x.done})"><button class="chk" aria-label="Tick">${x.done?'✓':''}</button>

 ((area!='shop')?prepCard()+tomorrowCard():'')};

async function logTemp(lk,id){const it=S.items.find(i=>i.id==id),v=parseT($('#t'+id).value,$('#t'+id+'s')?.classList.contains('on'));if(v===null)return toast('Type the temperature first','warn');if(Number.isNaN(v))return toast('Type a number, e.g. 4','warn');

function askFix(type,v,name){const r=S.rules[type];return new Promise(res=>{openDlg('⚠ '+(r[0]=='max'?'Too warm':'Too cold')+': '+v+'°C',`<p>${esc(name)} is out of range. What did you do?</p><div class="grid">${FIXES[r[0]].map(f=>`<button class="btn ghost full fixb">${f}</button>`).join('')}</div>`);

/* guided walk (kept from before) */
const PRESET={fridge:[2,3,4,5],freezer:[-16,-18,-20,-22],hot:[60,65,70,75],core:[75,80,85,90]};let W=null;
function walkStart(all){if(!me())return pickName();const q=all?walkUnits():pendingUnits();if(!q.length)return toast('All temps done ✓','good');W={q,i:0,v:'',neg:false,done:0};walkShow();$('#walk').showModal()}

 const[it,lk]=W.q[W.i],r=S.rules[it.type],fz=it.type=='freezer';if(W.v==='')W.neg=fz;$('#wProg').textContent=`${W.i+1} of ${W.q.length}`;$('#wBar').style.width=(100*W.i/W.q.length)+'%';
 const v=wNum(),ok=judgeT(it.type,v),last=logs(lk,it.id).pop();
 B.innerHTML=`<div><div class="wname">${ICON[it.type]||'🌡'} ${esc(it.name)}</div><div style="color:var(--sl)">${TYPES[it.type]||''}${last?' · last '+last.data.temp+'°C at '+hm12(last.at):''}</div></div>
 <div style="display:flex;gap:10px"><button class="sign ${W.neg?'on':''}" style="width:72px;min-height:72px" onclick="W.neg=!W.neg;walkShow()">${W.neg?'−':'+'}</button><div class="wdisp ${v==null?'empty':ok?'ok':'bad'}">${v==null?'__':(W.neg?'−':'')+W.v}°C</div></div>
 <div class="fb ${ok===true?'ok':ok===false?'bad':''}">${ok===true?'✓ In range':ok===false?'✗ Out of range':''}</div>
 <div class="chips">${(PRESET[it.type]||[]).map(p=>`<button class="chip" style="flex:1" onclick="W.neg=${p<0};W.v='${Math.abs(p)}';walkShow()">${p}</button>`).join('')}</div>
 <div class="pad">${['1','2','3','4','5','6','7','8','9','.','0','⌫'].map(k=>`<button onclick="wKey('${k}')">${k}</button>`).join('')}</div>
 <div class="row"><button class="btn ghost nogrow" onclick="W.i++;W.v='';walkShow()">Skip</button><button class="btn" onclick="walkLog()" ${v==null?'disabled':''}>${v==null?'Type the temp':ok===false?'⚠ Save':'✓ Save & next'}</button></div>`}
function wKey(k){if(k=='⌫')W.v=W.v.slice(0,-1);else if(k=='.'){if(!W.v.includes('.'))W.v+=(W.v?'':'0')+'.'}else if(W.v.replace('.','').length<4)W.v=(W.v=='0'?'':W.v)+k;walkShow()}

 `<div class="grid g2"><div class="card"><h2>This phone</h2><p class="help">Your name is remembered on this device.</p><div class="row"><label class="f">Your name<input id="stN" value="${esc(me())}" maxlength="40"></label><button class="btn nogrow keep" onclick="setName($('#stN').value)">Save</button></div>

 <div class="card"><h2>Lists</h2><p class="help">Change what shows on each page. Old records are kept.</p><div class="grid">${Object.entries(KN).map(([k,n])=>`<button class="btn ghost full" onclick="manage('${k}')">${n} (${items(k).length})</button>`).join('')}</div></div>
 <div class="card" style="grid-column:1/-1"><h2>🔑 Manager</h2>${mgr?`<p class="help">Manager mode is on for this browser session.</p><h2 style="font-size:14px;margin-top:10px">Shifts on ${S.date}</h2>${tbl(['Name','Area','Start','End','Hours',''],(S.shifts||[]).map(x=>[esc(x.staff),esc(x.area||''),`<span class="mono">${hm12(x.start_at)}</span>`,x.end_at?`<span class="mono">${hm12(x.end_at)}</span>`:'<span class="pill ok">On shift</span>',`<span class="mono">${x.hours??''}</span>`,`<button class="btn sm ghost keep" onclick="fixShift(${x.id})">Fix</button>`]))||'<div class="empty">No shifts.</div>'}
 <div class="row" style="margin-top:12px"><button class="btn ghost keep" onclick="testEmail()">✉ Send test email</button><button class="btn ghost keep" onclick="testHook()">💬 Send test message</button>${S.locked?'<button class="btn ghost keep" onclick="unlock()">Reopen this day</button>':''}<button class="btn ghost keep" onclick="mgr=false;sessionStorage.sw_mgr='';sessionStorage.sw_mpin='';render()">Exit manager</button></div>`:
 `<p class="help">Fix shift times, test email and reopen days.</p><button class="btn keep" onclick="mgrIn()">Enter manager PIN</button>`}</div></div>`;
async function mgrIn(){const pin=prompt('Manager PIN');if(!pin)return;const r=await fetch('/api/pincheck?pin='+encodeURIComponent(pin),{headers:{'X-Staff-Pin':localStorage.sw_pin||''}});if(!r.ok)return toast('Wrong PIN','warn');mgr=true;sessionStorage.sw_mgr='1';sessionStorage.sw_mpin=pin;render();toast('Manager mode on','good')}
async function testEmail(){toast('✉ Sending…');const r=await(await fetch('/api/test-email?pin='+encodeURIComponent(sessionStorage.sw_mpin||'')+'&staff='+encodeURIComponent(me()),{headers:{'X-Staff-Pin':localStorage.sw_pin||''}})).json();toast(r.status=='sent'?'✅ Test email sent to '+r.info:r.status=='not_configured'?'Email not set up on the server':'⚠ Email failed: '+(r.info||r.error||''),r.status=='sent'?'good':'warn')}
async function testHook(){toast('💬 Sending…');const r=await(await fetch('/api/test-webhook?pin='+encodeURIComponent(sessionStorage.sw_mpin||''),{headers:{'X-Staff-Pin':localStorage.sw_pin||''}})).json();toast('Message: '+(r.status||r.error),String(r.status).startsWith('sent')?'good':'warn')}
function fixShift(id){const x=S.shifts.find(s=>s.id==id);openDlg('Fix shift — '+x.staff,`<label class="f">Start<input type="time" id="fsS" value="${x.start_at.slice(11,16)}"></label><label class="f">End<input type="time" id="fsE" value="${x.end_at?x.end_at.slice(11,16):''}"></label><div class="row"><button class="btn" id="fsSave">Save</button><button class="btn danger nogrow" id="fsDel">Delete</button></div>`);
 $('#fsSave').onclick=async()=>{await post('/api/shift/fix',{id,start:$('#fsS').value,end:$('#fsE').value,pin:sessionStorage.sw_mpin},'✓ Shift saved');dlg.close()};
 $('#fsDel').onclick=async()=>{if(confirm('Delete this shift?')){await post('/api/shift/delete',{id,pin:sessionStorage.sw_mpin},'Shift deleted');dlg.close()}}}
/* dialogs: task + lists */
const dlg=$('#dlg');function openDlg(t,h){$('#dt').textContent=t;$('#dbody').innerHTML=h;if(!dlg.open)dlg.showModal()}
function taskDlg(id){if(!me())return pickName();const x=id?S.tasks.find(t=>t.id==id):{tab:area=='shop'?'shop':'kitchen',repeat:'once',title:'',due_time:''};
 openDlg(id?'Edit task':'Add task',`<label class="f">Task<input id="fT" value="${esc(x.title)}" placeholder="e.g. Restock cups and lids"></label>
 <label class="f">Where<div class="seg" id="fTab"><button data-v="kitchen">Kitchen</button><button data-v="shop">Shop / Site</button></div></label>
 <label class="f">How often<div class="seg" id="fR"><button data-v="once">Just today</button><button data-v="daily">Every day</button><button data-v="weekly">Weekly</button></div></label>
 <label class="f" id="fWl">Day of week<select id="fW">${DAYS.map((d,i)=>`<option value="${i}">${d}</option>`).join('')}</select></label>
 <label class="f">Due by (optional)<input type="time" id="fD" value="${x.due_time||''}"></label>
 <div class="row"><button class="btn" id="fSave">Save task</button>${id?'<button class="btn danger nogrow" id="fDel">Delete</button>':''}</div>`);
 const seg=(sel,v)=>{$$(sel+' button').forEach(b=>{b.classList.toggle('on',b.dataset.v==v);b.onclick=e=>{e.preventDefault();seg(sel,b.dataset.v)}});if(sel=='#fR')$('#fWl').hidden=v!='weekly'};
 seg('#fTab',x.tab);seg('#fR',x.repeat);$('#fW').value=x.weekday??((new Date(S.date).getDay()+6)%7);const val=s=>$(s+' button.on').dataset.v;
 $('#fSave').onclick=async()=>{if(!$('#fT').value.trim())return toast('Type the task','warn');await post('/api/task',{id,title:$('#fT').value,tab:val('#fTab'),repeat:val('#fR'),weekday:$('#fW').value,due_time:$('#fD').value},'✓ Task saved');dlg.close()};
 if(id)$('#fDel').onclick=async()=>{if(confirm('Delete this task?')){await post('/api/task',{id,delete:1},'Task deleted');dlg.close()}}}
const KN={fridge:'Shop fridges',freezer:'Shop freezers',kcheck:'Kitchen check points',prep:'Prep items',hotbox:'Hot box foods'};
function manage(kind){const its=items(kind),typ=kind=='kcheck';const TS=Object.entries(TYPES);
 openDlg('Edit '+KN[kind],`${its.map(i=>`<div class="row"><input id="m${i.id}" value="${esc(i.name)}">${typ?`<select id="y${i.id}">${TS.map(([k,v])=>`<option value="${k}" ${i.type==k?'selected':''}>${v.split(' —')[0]}</option>`).join('')}</select>`:''}<button class="btn sm ghost nogrow" onclick="ren(${i.id},'${kind}')">Save</button><button class="btn sm danger nogrow" onclick="rem(${i.id},'${kind}')">🗑</button></div>`).join('')}
 <hr style="border:0;border-top:1px solid var(--bd)"><div class="row"><input id="mNew" placeholder="Add new…">${typ?`<select id="yNew">${TS.map(([k,v])=>`<option value="${k}">${v.split(' —')[0]}</option>`).join('')}</select>`:''}<button class="btn nogrow" onclick="addItem('${kind}')">Add</button></div><p class="help">Removing keeps old records.</p>`)}
async function ren(id,k){await post('/api/item',{id,name:$('#m'+id).value,type:$('#y'+id)?.value},'✓ Saved');manage(k)}
async function rem(id,k){if(confirm('Remove from the list? (old records kept)')){await post('/api/item',{id,delete:1},'Removed');manage(k)}}
async function addItem(k){if(!$('#mNew').value.trim())return;await post('/api/item',{kind:k,name:$('#mNew').value,type:$('#yNew')?.value},'✓ Added');manage(k)}
/* boot */
page=PAGES.some(x=>x[0]==location.hash.slice(1))?location.hash.slice(1):'dashboard';
load().then(()=>{if(!me())pickName()});
setInterval(()=>{const a=document.activeElement;if(!dlg.open&&!$('#walk').open&&!['INPUT','SELECT','TEXTAREA'].includes(a.tagName)&&!$$('main input').some(e=>e.value&&e.type!='time'&&e.type!='date'))load($('#date').value)},60000);
/* PWA: service worker + install prompts */
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
(()=>{const bar=$('#installBar'),standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;if(standalone)return;let ev=null;
 const hide=k=>{bar.hidden=true;if(k)localStorage[k]='1'};$('#installX').onclick=()=>hide(ev?'sw_inst_no':'sw_ios_hint');
 addEventListener('beforeinstallprompt',e=>{e.preventDefault();ev=e;if(localStorage.sw_inst_no)return;$('#installTxt').innerHTML='<b>Install Silkwood</b><br>Add it to your home screen for one-tap access.';$('#installGo').hidden=false;bar.hidden=false});
 $('#installGo').onclick=async()=>{if(!ev)return;ev.prompt();const r=await ev.userChoice;ev=null;hide(r.outcome=='accepted'?'':'sw_inst_no')};
 addEventListener('appinstalled',()=>hide());
 const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform=='MacIntel'&&navigator.maxTouchPoints>1);
 if(ios&&!localStorage.sw_ios_hint)setTimeout(()=>{$('#installTxt').innerHTML='<b>Add Silkwood to your Home Screen</b><br>Tap Share <span aria-hidden="true">⎋</span>, then <b>Add to Home Screen</b>.';bar.hidden=false;localStorage.sw_ios_hint='1'},2500)})();
</script></body></html>
